<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swift</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='1' x2='1' y2='0'%3E%3Cstop stop-color='%23ffffff'/%3E%3Cstop offset='1' stop-color='%239c9ca6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath fill='url(%23g)' d='M3 22C9 21 19 16 29 5c-2 10-8 19-18 22 1.500-2 2.500-3.500 3.500-5-4.500 1-8.500 1-11.500 0z'/%3E%3C/svg%3E">
<script src="https://js.puter.com/v2/"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0f11;--panel:#141416;--panel2:#1a1a1d;--line:#26262b;--text:#e7e7ea;--mute:#8a8a94;--acc:#ffffff;--acc2:#a9a9b2;--ok:#5fd3a0;--err:#ff7a7a;--chat:420px;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--text);font:13px/1.55 Inter,system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.ic{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{display:grid;grid-template-columns:1fr 5px var(--chat);height:100%}
#app.nochat{grid-template-columns:1fr 0 0}
#app.nochat #chat,#app.nochat #split{display:none}
#stage{display:flex;flex-direction:column;min-width:0;background:var(--panel)}
.tabs{display:flex;align-items:stretch;height:38px;background:var(--bg);border-bottom:1px solid var(--line);flex:none}
.brand{display:flex;align-items:center;gap:9px;padding:0 16px 0 14px;font-weight:600;font-size:13.5px;letter-spacing:.2px;border-right:1px solid var(--line)}
.brand svg{width:20px;height:20px}
.tab{display:flex;align-items:center;gap:7px;padding:0 16px;color:var(--mute);border-right:1px solid var(--line);position:relative;transition:color .2s,background .2s}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text);background:var(--panel)}
.tab.on::after{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,var(--acc),var(--acc2));animation:grow .3s ease}
.tab .dot{width:6px;height:6px;border-radius:50%;background:var(--acc);display:none}
.tab.dirty .dot{display:block}
.sp{flex:1}
.tools{display:flex;align-items:center;gap:2px;padding:0 8px}
.tools button{width:28px;height:28px;display:grid;place-items:center;border-radius:6px;color:var(--mute);transition:.15s}
.tools button:hover:not(:disabled){background:var(--panel2);color:var(--text)}
.tools button:disabled{opacity:.35;cursor:default}
.tools button.on{color:var(--acc)}
#reopen{display:none}
#app.nochat #reopen{display:grid}
.views{position:relative;flex:1;min-height:0}
.view{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .25s}
.view.on{opacity:1;pointer-events:auto}
#frameWrap{height:100%;display:flex;justify-content:center;background:var(--panel)}
#frame{border:0;width:100%;height:100%;background:#fff;transition:width .3s cubic-bezier(.3,.7,.2,1);display:none}
#frameWrap.mobile #frame{width:390px;border-left:1px solid var(--line);border-right:1px solid var(--line)}
#empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
#empty .big{width:64px;height:64px;animation:float 4s ease-in-out infinite}
#empty h1{font-size:20px;font-weight:600}
#empty p{color:var(--mute);max-width:380px}
.sugg{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:520px;margin-top:6px}
.sugg button{padding:7px 12px;border:1px solid var(--line);border-radius:8px;color:var(--mute);background:var(--bg);transition:.2s}
.sugg button:hover{color:var(--text);border-color:#3a3a42;transform:translateY(-1px)}
#sweep{position:absolute;left:0;top:0;height:2px;width:100%;overflow:hidden;opacity:0;transition:opacity .3s;z-index:3}
#sweep.on{opacity:1}
#sweep i{display:block;height:100%;width:35%;background:linear-gradient(90deg,transparent,var(--acc),var(--acc2),transparent);animation:sweep 1.2s linear infinite}
#code{display:flex;overflow:auto;height:100%;font:12.5px/20px "JetBrains Mono",ui-monospace,monospace;padding:12px 0}
#gut{padding:0 14px 0 16px;text-align:right;color:#4b4b55;user-select:none;white-space:pre}
#src{white-space:pre;color:#d4d4d8;padding-right:40px;flex:1}
#src i{font-style:normal}.t{color:#d9dde6}.s{color:#e3b57a}.c{color:#6b7a6b}
.caret{display:inline-block;width:7px;height:15px;background:var(--acc);vertical-align:-2px;animation:blink 1s steps(1) infinite}
#split{cursor:col-resize;background:var(--line);transition:background .2s}
#split:hover,#split.drag{background:var(--acc)}
#chat{display:flex;flex-direction:column;min-width:0;background:var(--bg);position:relative}
.chead{display:flex;align-items:center;height:38px;padding:0 10px 0 16px;border-bottom:1px solid var(--line);flex:none}
.chead b{font-size:11px;font-weight:600;letter-spacing:1.2px;color:var(--text);border-bottom:1.5px solid var(--text);padding:9px 0 7px}
.chead .tools{padding:0}
#msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth}
.msg{animation:rise .35s cubic-bezier(.2,.8,.2,1)}
.msg.user{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 10px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border:1px solid var(--line);border-radius:5px;background:var(--panel2);color:var(--mute);font-size:11px}
.chip .ic{width:11px;height:11px}
.chip em{font-style:normal;color:#6c6c76}
.who{display:flex;align-items:center;gap:7px;margin-bottom:8px;font-weight:600;font-size:12px}
.who svg{width:16px;height:16px}
.steps{display:flex;flex-direction:column;gap:9px;margin-bottom:10px}
.step{display:flex;gap:10px;align-items:flex-start;animation:rise .3s ease}
.st{width:16px;height:16px;flex:none;margin-top:1px;display:grid;place-items:center;border-radius:50%}
.step.run .st{border:2px solid var(--line);border-top-color:var(--acc);animation:spin .8s linear infinite}
.step.ok .st{color:var(--ok);animation:pop .3s ease}
.step.err .st{color:var(--err)}
.sl{color:var(--text)}
.step.ok .sl{color:var(--mute)}
.ss{color:var(--mute);font-size:11.5px;font-family:"JetBrains Mono",monospace}
.dots b{font-weight:400;animation:dot 1.2s infinite both}.dots b:nth-child(2){animation-delay:.2s}.dots b:nth-child(3){animation-delay:.4s}
.step:not(.run) .dots{display:none}
.bar{height:4px;border-radius:4px;background:var(--panel2);margin:7px 0 4px;overflow:hidden;width:min(260px,100%)}
.bar i{display:block;height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .3s;position:relative;overflow:hidden}
.bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:sweep 1.1s linear infinite}
.txt{color:var(--text);white-space:pre-wrap}
.note{color:var(--mute);font-size:11.5px;margin-bottom:10px}.note:empty{display:none}
.keycard{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:10px;margin-top:6px;color:var(--mute)}.keycard a{color:var(--text)}
.kr{display:flex;gap:6px;margin-top:8px}.kr input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;color:var(--text);font:inherit;outline:0}.kr input:focus{border-color:#55555d}
.kr button{background:#fff;color:#000;border-radius:6px;padding:6px 11px;font-weight:500}
.txt.err{color:var(--err)}
#comp{margin:10px 12px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:8px 10px;transition:border-color .2s,box-shadow .2s;flex:none}
#comp:focus-within{border-color:#55555d;box-shadow:0 0 0 3px rgba(255,255,255,.06)}
#in{width:100%;background:none;border:0;outline:0;color:var(--text);font:inherit;resize:none;max-height:140px;min-height:40px;padding:2px 0}
#in::placeholder{color:#5f5f69}
.crow{display:flex;align-items:center;gap:8px;margin-top:4px;color:var(--mute);font-size:11.5px}
.crow button{display:inline-flex;align-items:center;gap:5px;padding:3px 6px;border-radius:5px}
.crow button:hover{background:var(--panel2);color:var(--text)}
.crow button:disabled{opacity:.4;cursor:default;background:none;color:var(--mute)}
.crow button.on{background:#fff;color:#000}
.cx{display:grid;place-items:center;margin-left:2px;color:var(--mute);padding:0}.cx:hover{color:var(--text)}
#hint{position:absolute;top:12px;left:50%;transform:translate(-50%,-8px);z-index:4;padding:6px 14px;background:#fff;color:#000;border-radius:999px;font-weight:500;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap}
#hint.on{opacity:1;transform:translate(-50%,0)}
#go{margin-left:auto;color:var(--text)}
#go.stop{color:var(--err)}
.tag{margin-left:7px;padding:0 6px;border:1px solid #55555d;border-radius:4px;font-size:10.5px;color:#e7e7ea;background:#232327}
.pop .tag{margin-left:8px}
.pop{position:absolute;z-index:9;background:var(--panel2);border:1px solid #33333a;border-radius:9px;padding:5px;min-width:250px;box-shadow:0 12px 34px rgba(0,0,0,.5);animation:rise .18s ease;display:none}
.pop.on{display:block}
.pop button{display:block;width:100%;text-align:left;padding:7px 9px;border-radius:6px}
.pop button:hover,.pop button.cur{background:#24242a}
.pop small{display:block;color:var(--mute);font-size:11px}
.pop .none{padding:8px 10px;color:var(--mute)}
#hist{top:40px;right:12px}
#mpop{left:24px;bottom:78px}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{transform:scale(.4);opacity:0}}
@keyframes dot{0%,80%,100%{opacity:.2}40%{opacity:1}}
@keyframes sweep{from{transform:translateX(-120%)}to{transform:translateX(320%)}}
@keyframes blink{50%{opacity:0}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes float{50%{transform:translateY(-6px)}}
@media(max-width:820px){#app{grid-template-columns:1fr;grid-template-rows:46% 1fr}#split{display:none}#app.nochat{grid-template-rows:1fr}#frameWrap.mobile #frame{width:100%}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#2a2a30;border-radius:9px;border:2px solid transparent;background-clip:content-box}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs><linearGradient id="lg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#9c9ca6"/></linearGradient></defs>
<symbol id="logo" viewBox="0 0 32 32"><path fill="url(#lg)" d="M3 22C9 21 19 16 29 5c-2 10-8 19-18 22 1.500-2 2.500-3.500 3.500-5-4.500 1-8.500 1-11.500 0z"/><path fill="url(#lg)" opacity=".55" d="M13 28.500c4-.5 8-2 11-4.500-1.500 3.500-5 6-11 4.500z"/></symbol>

<div id="app">
  <section id="stage">
    <div class="tabs">
      <div class="brand"><svg><use href="#logo"/></svg>Swift</div>
      <button class="tab on" id="tPrev" data-ic="eye">Preview<span class="dot"></span></button>
      <button class="tab" id="tCode" data-ic="code">index.html<span class="dot"></span></button>
      <div class="sp"></div>
      <div class="tools">
        <button id="bDesk" class="on" data-ic="desk" title="Desktop width"></button>
        <button id="bMob" data-ic="phone" title="Mobile width"></button>
        <button id="bRef" data-ic="refresh" title="Reload preview" disabled></button>
        <button id="bExt" data-ic="ext" title="Open in new tab" disabled></button>
        <button id="bDl" data-ic="dl" title="Download index.html" disabled></button>
        <button id="reopen" data-ic="chat" title="Open chat"></button>
      </div>
    </div>
    <div class="views">
      <div id="hint">Click any element in the preview to select it. Press Esc to cancel.</div>
      <div id="sweep"><i></i></div>

        <div id="frameWrap"><iframe id="frame" sandbox="allow-scripts allow-forms allow-modals allow-popups" title="Preview"></iframe></div>
        <div id="empty">
          <svg class="big"><use href="#logo"/></svg>
          <h1>What will you build?</h1>
          <p>Describe a page or app in the chat. Swift writes the file and shows it here as it is made.</p>
          <div class="sugg" id="sugg"></div>
        </div>
      </div>
      <div class="view" id="vCode"><div id="code"><div id="gut"></div><div id="src"></div></div></div>
    </div>
  </section>
  <div id="split"></div>

    <div class="chead"><b>CHAT</b><div class="sp"></div>
      <div class="tools">
        <button id="bNew" data-ic="plus" title="New chat"></button>
        <button id="bHist" data-ic="history" title="Versions"></button>
        <button id="bWide" data-ic="expand" title="Widen chat"></button>
        <button id="bClose" data-ic="close" title="Close chat"></button>
      </div>
    </div>
    <div class="pop" id="hist"></div>
    <div id="msgs"></div>

      <textarea id="in" rows="1" placeholder="Describe what to build or change, Enter to send"></textarea>
      <div class="crow">
        <button id="bModel"><span id="mname">Hollis 1.1</span></button>
        <button id="bSel" data-ic="cursor" disabled title="Select an element in the preview">Select</button>
        <button id="go" data-ic="ret">Send</button>
      </div>
    </div>

</div>

<script type="module">
const $=s=>document.querySelector(s), ic=n=>`<svg class="ic"><use href="#i-${n}"/></svg>`;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
document.querySelectorAll('[data-ic]').forEach(e=>e.insertAdjacentHTML('afterbegin',ic(e.dataset.ic)));
$('#model-chev')?.remove(); $('#bModel').insertAdjacentHTML('beforeend',ic('chev'));

/* ---------- Model configuration ----------
   Hollis 1.1 runs Qwen2.5-Coder Instruct in the browser through Transformers.js.
   Swap the ids below if you find a browser-ready ONNX build of a larger Qwen2.5-Coder. */
const TF_URL='https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.5.1';
const MODELS=[
 {name:'Hollis 1.1',cloud:true,note:'Cloud powered by top open coding models. No API key, no GPU needed'},
 {name:'Hollis 1.1 Promptu',cloud:true,promptu:true,tag:'Slow',note:'Writes a detailed design brief first, then builds. Smarter results, takes longer'},
 {name:'Hollis 1.1 Offline',id:'onnx-community/Qwen2.5-Coder-1.5B-Instruct',tag:'On device',note:'Runs on your own hardware, works offline after the first download'}];
const CLOUD_EXTRA='\n- This is a premium build: a considered layout, real micro-interactions, complete features and polished details. Reply with only the code block.';
const COMPACT='\n- Keep the whole file compact: under 110 lines, short CSS, one small script.';
const BRIEF_SYS=["You are a senior product designer and front-end architect. Expand the user's request into a precise build brief for a single HTML page, in plain text under these headings: Purpose, Audience, Palette (5 hex colors with roles), Typography, Layout (sections in order), Features (every control and exactly what it does), Interaction and motion, Copy (real headlines and button labels).","Be specific and opinionated, avoid generic choices, never use emojis, and keep it under 250 words. Output only the brief."].join('\n');
const BRIEF_EDIT_SYS="You are a senior front-end designer. Turn the user's change request into a precise, minimal change spec for an existing HTML page: the exact CSS properties and values (with hex colors), any markup changes, and hover or focus states. Do not redesign anything else. Never use emojis. Keep it under 120 words. Output only the spec.";
const FAST_ID='onnx-community/Qwen2.5-Coder-0.5B-Instruct';
const SYSTEM=[
"You are Hollis 1.1, an expert front-end engineer and visual designer working inside Swift, a vibe coding studio. You turn any request into one complete, polished, fully working HTML file.",
"Rules:",
"- Reply with exactly one fenced html code block holding a full document, then stop. Write nothing outside it.",
"- One self-contained file with inline <style> and <script>. No libraries or images loaded by URL; Google Fonts links are allowed. Draw visuals with CSS, gradients and inline SVG. Never use emojis; use inline SVG icons.",
"- Valid semantic HTML5 with a viewport meta tag. Responsive with CSS grid, flexbox and clamp(); works at 360px wide.",
"- Design: define 4 to 6 CSS variables on :root for a distinctive palette, use one or two typefaces with a clear type scale, generous spacing, one consistent radius, visible hover and focus states, subtle transitions and strong contrast. Never ship unstyled buttons or default blue links. Write real, specific copy, never lorem ipsum.",
"- Functionality: every button, form and control must work. Use vanilla JavaScript with small clear functions and event listeners. No placeholders or TODO comments. Wrap localStorage use in try/catch. Handle empty and error states.",
"- When given a current file plus a change request, return the complete updated file and keep everything that was not asked to change.",
"- Before closing the block, make sure all tags are closed and every id used in JavaScript exists in the HTML."].join('\n');
const PREFILL="```html\n<!DOCTYPE html>\n";

let picked=null,sm=false,cancel=false,html='',versions=[],gen=null,tf=null,mi=0,busy=false,stopper=null;
const msgs=$('#msgs'),inp=$('#in');
const scroll=()=>msgs.scrollTop=msgs.scrollHeight;
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const mb=n=>n>1e9?(n/1e9).toFixed(2)+' GB':(n/1e6).toFixed(0)+' MB';

/* ---------- views ---------- */
function view(v){$('#tPrev').classList.toggle('on',v==='p');$('#tCode').classList.toggle('on',v==='c');$('#vPrev').classList.toggle('on',v==='p');$('#vCode').classList.toggle('on',v==='c');$('#tPrev').classList.remove('dirty');$('#tCode').classList.remove('dirty')}
$('#tPrev').onclick=()=>view('p');$('#tCode').onclick=()=>view('c');
const hl=s=>esc(s).replace(/(&lt;!--[\s\S]*?--&gt;)|(\/\*[\s\S]*?\*\/)|(&lt;\/?[a-zA-Z][\w-]*)|("[^"\n]*"|'[^'\n]*')/g,(m,a,b,c)=>a||b?`<i class="c">${m}</i>`:c?`<i class="t">${m}</i>`:`<i class="s">${m}</i>`);
function paintCode(t,live){const n=t.split('\n').length;$('#gut').textContent=Array.from({length:n},(_,i)=>i+1).join('\n');$('#src').innerHTML=(live?esc(t):hl(t))+(live?'<span class="caret"></span>':'');if(live){const c=$('#code');c.scrollTop=c.scrollHeight}}
function setFile(h){
  html=h;paintCode(h,false);
  const f=$('#frame');f.style.display='block';f.srcdoc=inject(h);picked=null;selMode(false);$('#bSel').disabled=false;$('#empty').style.display='none';
  ['#bRef','#bExt','#bDl'].forEach(s=>$(s).disabled=false);chips();
}
function chips(){
  const n=html?html.split('\n').length:0,c=$('#cchips');

/* ---------- chat chrome ---------- */
const app=$('#app');
const SEL_JS='('+(function(){
  var on=false,sel=null,hov=null,P=window.parent,D=document.documentElement;
  var box=document.createElement('div'),lab=document.createElement('div');
  box.style.cssText='position:fixed;pointer-events:none;z-index:2147483647;border:2px solid #fff;outline:1px solid #000;background:rgba(255,255,255,.14);display:none';
  lab.style.cssText='position:fixed;pointer-events:none;z-index:2147483647;background:#fff;color:#000;font:600 11px/1 monospace;padding:4px 6px;border-radius:3px;display:none;white-space:nowrap';
  D.appendChild(box);D.appendChild(lab);
  function name(el){var n=el.tagName.toLowerCase();if(el.id)n+='#'+el.id;else if(typeof el.className==='string'&&el.className.trim())n+='.'+el.className.trim().split(/\s+/)[0];return n}
  function path(el){var p=[];while(el&&el.nodeType===1&&el!==D){var s=el.tagName.toLowerCase();if(el.id){p.unshift(s+'#'+el.id);break}var i=1,n=el;while((n=n.previousElementSibling))if(n.tagName===el.tagName)i++;p.unshift(s+':nth-of-type('+i+')');el=el.parentElement}return p.join(' > ')}
  function show(el){if(!el){box.style.display=lab.style.display='none';return}var r=el.getBoundingClientRect();
    box.style.display=lab.style.display='block';box.style.left=r.left+'px';box.style.top=r.top+'px';box.style.width=r.width+'px';box.style.height=r.height+'px';
    lab.textContent=name(el);lab.style.left=Math.max(0,r.left)+'px';lab.style.top=(r.top>24?r.top-24:r.bottom+2)+'px'}
  document.addEventListener('mousemove',function(e){if(!on)return;hov=e.target;show(hov)},true);
  ['mousedown','mouseup','submit'].forEach(function(t){document.addEventListener(t,function(e){if(on){e.preventDefault();e.stopPropagation()}},true)});
  document.addEventListener('click',function(e){if(!on)return;e.preventDefault();e.stopPropagation();var el=e.target;sel=el;hov=null;on=false;D.style.cursor='';show(sel);
    P.postMessage({swift:'pick',sel:path(el),label:name(el),html:el.outerHTML.slice(0,1500),text:(el.innerText||'').trim().slice(0,80)},'*')},true);
  document.addEventListener('keydown',function(e){if(e.key==='Escape')P.postMessage({swift:'cancel'},'*')});
  addEventListener('scroll',function(){show(on?hov:sel)},true);addEventListener('resize',function(){show(on?hov:sel)});
  addEventListener('message',function(e){var d=e.data;if(!d||!d.swift)return;
    if(d.swift==='mode'){on=d.on;hov=null;D.style.cursor=on?'crosshair':'';show(on?null:sel)}
    if(d.swift==='clear'){sel=null;show(null)}});
}).toString()+')()';
const inject=h=>{const t='<script>'+SEL_JS+'<\/script>',i=h.toLowerCase().lastIndexOf('</body>');return i<0?h+t:h.slice(0,i)+t+h.slice(i)};

  if(d.swift==='pick'){picked=d;selMode(false);chips();inp.focus()}else if(d.swift==='cancel')selMode(false)});

$('#bClose').onclick=()=>app.classList.add('nochat');$('#reopen').onclick=()=>app.classList.remove('nochat');

const sp=$('#split');sp.onpointerdown=e=>{sp.setPointerCapture(e.pointerId);sp.classList.add('drag')};
sp.onpointermove=e=>{if(sp.classList.contains('drag'))document.documentElement.style.setProperty('--chat',Math.min(820,Math.max(320,innerWidth-e.clientX))+'px')};
sp.onpointerup=()=>sp.classList.remove('drag');

  MODELS.forEach((m,i)=>{const b=document.createElement('button');b.className=i===mi?'cur':'';b.innerHTML=`${m.name}${m.tag?`<span class="tag">${m.tag}</span>`:''}<small>${m.note}</small>`;b.onclick=()=>{if(busy)return;mi=i;lab();pops()};p.append(b)});p.classList.add('on')};
$('#bNew').onclick=()=>{if(busy)return;msgs.innerHTML='';html='';versions=[];picked=null;selMode(false);$('#bSel').disabled=true;$('#frame').style.display='none';$('#frame').srcdoc='';$('#empty').style.display='flex';['#bRef','#bExt','#bDl'].forEach(s=>$(s).disabled=true);paintCode('',false);chips();view('p')};
inp.oninput=()=>{inp.style.height='auto';inp.style.height=Math.min(140,inp.scrollHeight)+'px'};

/* ---------- message builders ---------- */
function userMsg(t){const d=document.createElement('div');d.className='msg user';d.innerHTML='<div class="chips">'+(html?`<span class="chip">${ic('file')}index.html <em>Current File</em></span>`:'')+(picked?`<span class="chip">${ic('cursor')}${esc(picked.label)} <em>Selected</em></span>`:'')+'</div><div class="t"></div>';d.querySelector('.t').textContent=t;if(!html)d.querySelector('.chips').remove();msgs.append(d);scroll()}
function aiMsg(){const d=document.createElement('div');d.className='msg';d.innerHTML=`<div class="who"><svg width="16" height="16"><use href="#logo"/></svg>${MODELS[mi].name}</div><div class="steps"></div><div class="note"></div><div class="txt"></div>`;msgs.append(d);scroll();
  const box=d.querySelector('.steps');
  return{txt:d.querySelector('.txt'),note:d.querySelector('.note'),step(label){
    const el=document.createElement('div');el.className='step run';el.innerHTML='<span class="st"></span><div class="sb"><div class="sl"></div><div class="ss"></div></div>';
    const sl=el.querySelector('.sl'),ss=el.querySelector('.ss');sl.innerHTML=label+'<span class="dots"><b>.</b><b>.</b><b>.</b></span>';box.append(el);scroll();let bar;
    const end=(c,i,l)=>{el.className='step '+c;el.querySelector('.st').innerHTML=ic(i);if(l!=null)sl.textContent=l;bar?.parentElement.remove()};
    return{sub:t=>ss.textContent=t,
      bar(f,t){if(!bar){const b=document.createElement('div');b.className='bar';b.innerHTML='<i></i>';el.querySelector('.sb').insertBefore(b,ss);bar=b.firstChild}bar.style.width=Math.round(f*100)+'%';ss.textContent=t},
      done:l=>end('ok','check',l),fail:l=>end('err','x',l)}}}}
async function typeOut(el,t){for(let i=0;i<=t.length;i+=2){el.textContent=t.slice(0,i);scroll();await sleep(14)}el.textContent=t}

/* ---------- model ---------- */
let dev='wasm',lite=true;
async function loadModel(st){
  const m=MODELS[mi];if(gen&&gen._id===m.id)return;
  try{tf??=await import(TF_URL)}catch(e){throw new Error('Could not load Transformers.js from cdn.jsdelivr.net. Check your internet, ad blocker or VPN.')}
  tf.env.allowLocalModels=false;tf.env.useBrowserCache=location.protocol.startsWith('http');
  st.sub('Looking for a GPU');
  const ad=navigator.gpu?await navigator.gpu.requestAdapter().catch(()=>null):null;
  const f16=!!ad&&ad.features.has('shader-f16');
  let vendor='';if(ad){const i=ad.info||(await ad.requestAdapterInfo?.().catch(()=>null))||{};vendor=((i.vendor||'')+' '+(i.architecture||'')+' '+(i.description||'')).toLowerCase()}
  lite=!ad||vendor.includes('intel');
  const rid=lite?FAST_ID:m.id;
  st.sub('Checking connection to Hugging Face');
  const reach=async u=>{try{return (await fetch(u,{cache:'no-store'})).ok}catch{return false}};
  const cfg=rid+'/resolve/main/config.json';
  if(!await reach('https://huggingface.co/'+cfg)){
    if(await reach('https://hf-mirror.com/'+cfg)){tf.env.remoteHost='https://hf-mirror.com/';st.sub('Hugging Face is unreachable, using a mirror')}
    else throw new Error('This page cannot reach huggingface.co. If you opened it inside the Claude preview, download Swift.html and open it from your computer in Chrome or Edge. Otherwise check your internet, VPN or firewall.');
  }
  const files={};let top=0;
  const cb=p=>{if(p.status==='progress'&&p.total){files[p.file]=[p.loaded,p.total];let l=0,t=0;for(const k in files){l+=files[k][0];t+=files[k][1]}top=Math.max(top,l/t);st.bar(top,`${mb(l)} of ${mb(t)}`)}else if(p.status==='initiate')st.sub('Fetching '+p.file.split('/').pop())};
  const tries=ad?(f16?[['webgpu','q4f16'],['webgpu','q4']]:[['webgpu','q4']]):[['wasm','q4']];const errs=[];
  for(const[device,dtype]of tries){try{gen=await tf.pipeline('text-generation',rid,{device,dtype,progress_callback:cb});gen._id=m.id;dev=device;st.sub(device==='webgpu'?(lite?'Running the compact engine on your Intel GPU':'Running on your GPU'):'No GPU found, using the compact engine on CPU');return}catch(e){errs.push(device+' '+dtype+': '+(e.message||e));console.warn(device,dtype,e);st.sub('Retrying with another setup')}}
  throw new Error('Model failed to load. '+errs.join(' | '));
}

/* ---------- cloud (Puter.js, no API key) ---------- */
const CLOUD_MODELS=['deepseek/deepseek-v4.1-flash','moonshotai/kimi-k2.6','z-ai/glm-5.1','poolside/laguna-m.1:free','minimax/minimax-m3'];
const perr=e=>e?.error?.message||e?.message||(typeof e==='string'?e:'Cloud request failed');
async function cloudChat(msgs,o){
  if(!window.puter)throw new Error('Puter.js could not be loaded from js.puter.com. Check your internet connection or ad blocker.');
  let last=new Error('Cloud request failed');
  for(const model of CLOUD_MODELS){
    let acc='',think=0;
    try{
      const resp=await puter.ai.chat(msgs,{model,stream:true,max_tokens:o.max,temperature:o.temp});
      for await(const part of resp){
        if(o.signal.aborted)break;
        if(part?.text){acc+=part.text;o.onText?.(acc)}
        else if(part?.reasoning){think+=part.reasoning.length;o.onThink?.(think)}
      }
      if(o.signal.aborted||acc.trim())return acc;
      last=new Error('The cloud model returned an empty reply');
    }catch(e){
      if(o.signal.aborted||acc.trim())return acc;
      last=new Error(perr(e));console.warn(model,e);
      if(/auth|sign.?in|cancel/i.test(last.message)){throw new Error('Sign in to Puter is needed. Puter gives free accounts access to the AI models.')}
    }
  }
  throw last;
}
async function run(msgs,o){
  if(MODELS[mi].cloud){const ac=new AbortController();stopper={interrupted:false,interrupt(){this.interrupted=true;ac.abort()}};return cloudChat(msgs,{...o,signal:ac.signal})}
  const pre=o.prefill||'';
  const prompt=gen.tokenizer.apply_chat_template(msgs,{tokenize:false,add_generation_prompt:true})+pre;
  stopper=new tf.InterruptableStoppingCriteria();let acc=pre;
  const streamer=new tf.TextStreamer(gen.tokenizer,{skip_prompt:true,skip_special_tokens:true,callback_function:c=>{acc+=c;if(o.fence&&acc.lastIndexOf('\n```')>=pre.length-1){stopper.interrupt();return}o.onText?.(acc)}});
  await gen(prompt,{max_new_tokens:o.max,do_sample:true,temperature:o.temp,top_p:.9,repetition_penalty:1.05,streamer,stopping_criteria:stopper});
  return acc;
}
function extract(t){const i=t.indexOf('```');if(i>=0)t=t.slice(t.indexOf('\n',i)+1);else{const j=t.search(/<!doctype|<html/i);if(j>=0)t=t.slice(j)}const e=t.indexOf('\n```');if(e>=0)t=t.slice(0,e);return t.replace(/\s+$/,'')}

/* ---------- main flow ---------- */
async function submit(){
  const text=inp.value.trim();if(!text||busy)return;
  cancel=false;busy=true;inp.value='';inp.oninput();const go=$('#go');go.classList.add('stop');go.innerHTML=ic('stop')+'Stop';
  const pk=picked,M=MODELS[mi],cloud=!!M.cloud;userMsg(text);const ai=aiMsg(),t0=performance.now();
  let authP=null;if(cloud&&window.puter&&!puter.auth.isSignedIn())authP=puter.auth.signIn();
  try{
    let s=ai.step('Reading your request');await sleep(450);s.done('Read your request');
    if(cloud&&!window.puter)throw new Error('Puter.js could not be loaded from js.puter.com. Check your internet connection or ad blocker.');
    if(authP){s=ai.step('Signing in to Puter');s.sub('A free Puter account lets the cloud models run for you. A popup may appear');await authP;s.done('Signed in to Puter')}
    if(!cloud){
      if(!gen||gen._id!==M.id){s=ai.step(`Loading ${M.name}`);s.sub('First run downloads the model, later runs use the browser cache');await loadModel(s);s.done(`${M.name} ready`)}
      if(dev==='webgpu'&&lite)ai.note.textContent='Intel integrated graphics detected, so Swift runs the compact engine on your GPU for speed. Pages come out shorter and simpler than on a dedicated graphics card.';else if(dev==='wasm')ai.note.textContent='No GPU acceleration was found, so Swift is using the compact CPU engine. For full speed, use Chrome or Edge with hardware acceleration on, or switch to the cloud models in the model menu.';
    }
    let brief='';
    if(M.promptu){
      s=ai.step('Writing a detailed design brief');s.sub('Promptu thinks the request through first');
      const b=await run([{role:'system',content:html?BRIEF_EDIT_SYS:BRIEF_SYS},{role:'user',content:pk?'Selected element: '+pk.label+(pk.text?' with text "'+pk.text+'"':'')+'. Request: '+text:text}],{max:600,temp:.6,onText:t=>s.sub(`${t.trim().split(/\s+/).length} words of brief`)});
      if(cancel)throw new Error('Stopped before building');
      brief=b.trim();s.done('Wrote a detailed design brief');
    }else{s=ai.step('Planning layout and design');await sleep(700);s.done('Planned layout and design')}
    s=ai.step(pk?'Editing '+pk.label:'Making index.html');s.sub(cloud?'Waiting for the cloud model':'');let thought=false;$('#sweep').classList.add('on');view('c');
    const cur=html&&html.length<(cloud?60000:pk?14000:9000);
    let user=cur?'Current file:\n```html\n'+html+'\n```\nApply this change and return the full updated file: '+text:(html?'Rebuild the page from scratch. Request: '+text:text);
    if(cur&&pk)user='Current file:\n```html\n'+html+'\n```\nThe user selected this element in the preview (CSS path: '+pk.sel+'):\n```html\n'+pk.html+'\n```\nApply the change ONLY to this selected element and its styles. Keep the rest of the file exactly as it is and return the full updated file. Change request: '+text;
    if(brief)user+='\n\nDesign brief to follow closely:\n'+brief;
    const compact=!cloud&&lite,tg=performance.now();let raf=0;
    const raw=await run([{role:'system',content:SYSTEM+(cloud?CLOUD_EXTRA:'')+(compact?COMPACT:'')},{role:'user',content:user}],{max:cloud?8000:(lite?1500:3000),temp:.5,onThink:()=>{if(!thought){thought=true;s.sub('The model is thinking through the design')}},prefill:cloud?'':PREFILL,fence:true,onText:t=>{
      const c=extract(t);s.sub(`${c.split('\n').length} lines, ${(c.length/1024).toFixed(1)} KB, about ${Math.round(c.length/4/Math.max(.3,(performance.now()-tg)/1000))} tokens/s`);
      if(!raf)raf=requestAnimationFrame(()=>{raf=0;paintCode(extract(t),true)})}});
    const stopped=!!stopper?.interrupted;
    let out=extract(raw);
    if(out.length<40){if(cancel)throw new Error('Stopped before any code was written');throw new Error('The model did not return any code. Try rephrasing your request.')}
    if(!/<\/html>\s*$/i.test(out)){if(!/<\/body>/i.test(out))out+='\n</body>';out+='\n</html>'}
    s.done(`Made index.html, ${out.split('\n').length} lines`);
    s=ai.step('Rendering preview');await sleep(350);
    versions.push({h:out,p:text});setFile(out);$('#sweep').classList.remove('on');view('p');s.done('Preview updated');
    const secs=((performance.now()-t0)/1000).toFixed(0);
    await typeOut(ai.txt,(stopped?'Stopped early and kept what was written. ':'')+`Finished in ${secs}s. The preview is live on the left. Tell me what to change and I will update index.html.`);
  }catch(e){console.error(e);$('#sweep').classList.remove('on');
    msgs.querySelector('.step.run:last-of-type')?.classList.replace('run','err');
    {ai.txt.className='txt err';ai.txt.textContent='Something went wrong: '+(e.message||e)+(cloud?'\nCheck your internet connection and try again. If a Puter sign-in popup was blocked, allow popups for this page. You can also switch to Hollis 1.1 Offline in the model menu.':'\nClose other heavy tabs if memory is low and use Chrome or Edge for GPU speed.')}}
  busy=false;stopper=null;go.classList.remove('stop');go.innerHTML=ic('ret')+'Send';scroll();
}
paintCode('',false);
</script>
